<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nero</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/loading-style.css">
    <link rel="stylesheet" href="styles/login-style.css">
    <link rel="stylesheet" href="styles/content-style.css">
</head>

<body>
    <main id="loading" class="view">
        <img src="assets/xd.jpg" alt="LoAdInG-d-d--b">
    </main>
    <main id="login" class="view hidden">
        <h1>Chciałbym życzyć Ci miłego dnia!</h1>
        <div class="small-ball"></div>
        <div class="large-ball">
            <img src="assets/xd.jpg" alt="LoAdInG-d-d--b">
        </div>
        <form class="login-form">
            <label for="login">Login:</label>
            <input type="text" id="login-input" placeholder="Login eingeben" autocomplete="off">
            <label for="password">Hasło:</label>
            <input type="password" id="password-input" placeholder="Passwort eingeben" autocomplete="off">
            <button type="button" id="loginBtn">Gosh, here we go again</button>
        </form>

    </main>
    <main id="app" class="view hidden">
        <h1>Generator Kodów Kreskowych</h1>

        <div class="input-group">
            <label for="barcodeText">Tekst do zakodowania:</label>
            <input type="text" id="barcodeText" placeholder="Wprowadź tekst..." autocomplete="off">
        </div>

        <div class="input-group">
            <label for="filename">Nazwa pliku (bez .png):</label>
            <input type="text" id="filename" placeholder="np. moj_kod" autocomplete="off">
        </div>

        <div class="actions">
            <button id="generateBtn">Generuj kod</button>
            <button id="downloadBtn" class="hidden">Pobierz PNG</button>
        </div>

        <div class="canvas-container">
            <canvas id="barcodeCanvas"></canvas>
        </div>

        <div class="actions">
            <input type="text" id="hashInput" placeholder="Wprowadź hash do porównania..." autocomplete="off">
            <button type="button" id="compareBtn">Porównaj</button>
        </div>

        <div class="result"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>

</html>
